<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cellix — Signed in</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Georgia, 'Times New Roman', serif;
        background:
          radial-gradient(ellipse 80% 60% at 20% 10%, rgba(14, 116, 144, 0.18), transparent 55%),
          linear-gradient(160deg, #f0f7f8 0%, #e8eef2 100%);
        color: #0f3d3e;
      }
      .panel {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        line-height: 1.45;
        color: #5a6577;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1 id="title">Signing you in…</h1>
      <p id="message">Please wait a moment.</p>
    </div>
    <script type="module" src="./auth-complete.ts"></script>
  </body>
</html>
